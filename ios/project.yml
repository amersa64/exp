name: TheCoach
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7QF5D7PJL5
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
targets:
  TheCoach:
    type: application
    platform: iOS
    sources:
      - path: TheCoach
    info:
      path: TheCoach/Info.plist
      properties:
        CFBundleDisplayName: The Coach
        CoachBackendURL: http://127.0.0.1:8765
        NSHealthShareUsageDescription: Read workout data to verify completed sessions and time nudges.
        NSHealthUpdateUsageDescription: Not used.
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.zaimler.TheCoach
        GENERATE_INFOPLIST_FILE: NO
